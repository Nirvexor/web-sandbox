<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monatery Toggle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="main">
    <div class="package">
        <div class="box">
            <h2>Change the world to gray or black</h2>

            <div class="buttons"> <!-- This div is for to keep the buttons on the same line-->
            <button id="white-button" onclick="white_background_color()">Turn it White</button>
            <button id="gray-button" class="gray-button" onclick="gray_background_color()">Turn it Gray</button>
            <button id="black-button" class="black-button" onclick="black_background_color()">Turn it Black</button>
            </div>

            <div class="buttons"> <!-- This div is for to keep the buttons on the same line-->
            <button id="white-button-alternative">Turn it White</button>
            <button id="gray-button-alternative" class="gray-button">Turn it Gray</button>
            <button id="black-button-alternative" class="black-button">Turn it Black</button>
            </div>

            <div class="buttons"> <!-- This div is for to keep the buttons on the same line-->
            <button id="white-button-alternative2">Turn it White DRY</button>
            <button id="gray-button-alternative2" class="gray-button">Turn it Gray DRY</button>
            <button id="black-button-alternative2" class="black-button">Turn it Black DRY</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
